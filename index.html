<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜讀請假</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22305F; --paper:#F4F6FB; --card:#fff; --lamp:#E8A43A; --lamp-soft:#FCEFD3;
    --slate:#566180; --line:#D6DBE9; --danger:#B3382C; --ok:#2E7D5B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:#1B2238;
    font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .top{background:var(--ink);color:#fff;padding:22px 0 20px}
  .top h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:.02em}
  .top p{margin:6px 0 0;color:#C9D1EC;font-size:14px}
  .top p + p{margin-top:2px}
  main{padding-top:16px;padding-bottom:40px}
  h2{font-size:17px;margin:0 0 10px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:14px}
  label{display:block;font-weight:600;font-size:15px;margin:14px 0 4px}
  label:first-of-type{margin-top:0}
  input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #B8C0D6;border-radius:8px;
    background:#fff;color:inherit;min-height:46px}
  textarea{min-height:76px;resize:vertical}
  :focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
  .btn{font:inherit;font-weight:700;min-height:48px;padding:0 20px;border-radius:10px;border:0;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff;width:100%;margin-top:18px;font-size:17px}
  .btn.add{background:#fff;color:var(--ink);border:1.5px solid var(--ink);width:100%;margin-top:10px}
  .btn:disabled{opacity:.55;cursor:wait}
  .link{background:none;border:0;font:inherit;color:var(--ink);text-decoration:underline;
    padding:8px 4px;min-height:40px;cursor:pointer}
  .muted{color:var(--slate)}
  .small{font-size:13.5px}
  .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

  #banner{padding:12px 14px;border-radius:8px;margin-bottom:12px;font-weight:600}
  #banner.ok{background:#DDF0E6;color:#1F5C41}
  #banner.error{background:#FBE3DF;color:#8C2A20}

  /* 日期:從/到,加入後變成可移除的標籤 */
  .daterow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .dchip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:99px;
    background:var(--lamp-soft);border:1.5px solid var(--lamp);color:var(--ink);
    font:inherit;font-weight:700;font-size:15px;cursor:pointer}

  /* 夜讀時間軸:深色=到校,斜線=請假 */
  .strip{display:flex;align-items:stretch;margin:6px 0 6px}
  .gap{flex:0 0 2px;margin:0 4px;background:repeating-linear-gradient(to bottom,#AEB7D1 0 4px,transparent 4px 8px)}
  .slot{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
    min-height:104px;padding:12px 6px;border:2px solid var(--ink);border-radius:6px;
    background:var(--ink);color:#fff;text-align:center;font:inherit;cursor:pointer}
  .s-name{font-weight:700;font-size:16px}
  .s-time{font-size:12.5px;font-variant-numeric:tabular-nums}
  .s-state{font-size:15px;font-weight:700;border-top:1px solid rgba(255,255,255,.35);padding-top:6px}
  .slot[aria-pressed="true"]{
    background:repeating-linear-gradient(135deg,var(--lamp-soft) 0 7px,#F6D58F 7px 14px);
    border-color:var(--lamp);color:var(--ink)}
  .slot[aria-pressed="true"] .s-state{border-top-color:rgba(34,48,95,.35)}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .summary{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--lamp);background:var(--lamp-soft);
    border-radius:0 8px 8px 0;font-weight:600}

  .rec{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
  .rec:first-child{border-top:0;padding-top:0}
  .rec .d{font-weight:700}
  .rec .m{font-size:14px;color:var(--slate)}
  .rec.off .d,.rec.off .m{text-decoration:line-through}
  .chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px;
    background:#DDF0E6;color:var(--ok);margin-left:6px;text-decoration:none;vertical-align:1px}
  .chip.off{background:#E8EAF1;color:var(--slate)}
  .rec .cancel{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:8px;font:inherit;font-weight:700;
    font-size:14px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);cursor:pointer}
  .rec .cancel.armed{background:var(--danger);border-color:var(--danger);color:#fff}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:no-preference){ .slot{transition:background .12s,border-color .12s} }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1 id="title">夜讀請假</h1>
  <p id="period"></p>
  <p id="cutoffTop"></p>
</div></header>

<main class="wrap">
  <div id="banner" hidden></div>

  <!-- 驗證 -->
  <section id="loginView" class="card" hidden>
    <h2>請先確認學生身分</h2>
    <p class="muted small" style="margin-top:-4px">請輸入下面的資料,通過後才能請假與查看紀錄。</p>
    <form id="loginForm" autocomplete="off" novalidate>
      <div id="fields"></div>
      <button class="btn primary" id="loginBtn" type="submit">進入請假</button>
    </form>
  </section>

  <!-- 請假 -->
  <section id="mainView" hidden>
    <div class="who">
      <div><strong id="who"></strong> 家長您好</div>
      <button class="link" id="logout" type="button">登出</button>
    </div>

    <div class="card">
      <h2>請假日期</h2>
      <div class="daterow">
        <div>
          <label for="dateFrom">從</label>
          <select id="dateFrom"></select>
        </div>
        <div>
          <label for="dateTo">到(連續請假才選)</label>
          <select id="dateTo"></select>
        </div>
      </div>
      <button class="btn add" id="addDates" type="button">加入日期</button>
      <div class="chips" id="chips" aria-live="polite"></div>
      <p class="muted small" id="dateHint" style="margin:10px 0 0"></p>
      <p id="noDates" class="muted small" hidden>目前沒有可以線上請假的日期,請直接聯絡導師。</p>

      <h2 style="margin-top:22px">請假節次</h2>
      <div class="strip" id="strip" role="group" aria-label="請假節次"></div>
      <p class="muted small" id="breaks" style="margin:0"></p>
      <div class="tools">
        <button class="link" id="allNight" type="button">整晚請假</button>
        <button class="link" id="clearSel" type="button">全部取消</button>
      </div>
      <p class="muted small" style="margin:0">點選要請假的節次。只選第一節是晚到,只選最後一節是提早離開。節次會套用到上面所有日期。</p>

      <label for="reason">事由</label>
      <select id="reason"></select>

      <label for="note">備註(選填)</label>
      <textarea id="note" placeholder="不需要填寫病情細節"></textarea>

      <p class="summary" id="summary" aria-live="polite"></p>
      <button class="btn primary" id="submitBtn" type="button">送出請假</button>
      <p class="muted small" id="cutoffNote" style="margin:12px 0 0"></p>
    </div>

    <div class="card">
      <h2>我的請假紀錄</h2>
      <div id="records"></div>
    </div>
  </section>
</main>

<script>
(function () {
  // ★★ 把下面這行換成 Apps Script「管理部署作業」裡的網頁應用程式網址(結尾是 /exec)
  var API_URL = 'https://script.google.com/macros/s/AKfycbywET-JxNC0gPN7hqaj3qs2xHsvf3JcLqFcebzNnacV5zEdGrYsj9NVt1Y8dFbCT9Gvew/exec';

  var cfg = null, creds = null, sel = {}, picked = [], openDates = [];
  var $ = function (id) { return document.getElementById(id); };

  function showBanner(kind, msg) {
    var b = $('banner');
    b.className = kind; b.textContent = msg; b.hidden = false;
    b.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    b.scrollIntoView({ block: 'nearest' });
  }
  function clearBanner() { $('banner').hidden = true; }
  function setBusy(on) { $('loginBtn').disabled = on; $('submitBtn').disabled = on; }

  // 呼叫 Apps Script。用 text/plain 送出,瀏覽器就不會多送一次預檢請求(Apps Script 不支援預檢)
  function post(body) {
    if (!API_URL || API_URL.indexOf('/exec') < 0) {
      return Promise.reject(new Error('尚未設定 API_URL'));
    }
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function run(fn, args, ok) {
    var body = fn === 'apiLogin' ? { action: 'login', creds: args[0] }
             : fn === 'apiSubmit' ? { action: 'submit', creds: args[0], payload: args[1] }
             : { action: 'cancel', creds: args[0], id: args[1] };
    setBusy(true);
    post(body).then(function (res) {
      setBusy(false); ok(res);
    }).catch(function (e) {
      setBusy(false);
      showBanner('error', '系統暫時無法使用,請稍後再試,或直接聯絡導師。');
      console.error(e);
    });
  }

  function show(view) {
    $('loginView').hidden = view !== 'login';
    $('mainView').hidden = view !== 'main';
    window.scrollTo(0, 0);
  }

  /* 初始化 */
  post({ action: 'init' })
    .then(function (c) { cfg = c; buildStatic(); show('login'); })
    .catch(function (e) {
      showBanner('error', '系統暫時無法使用,請稍後再試。');
      console.error(e);
    });

  function buildStatic() {
    $('title').textContent = cfg.title;
    $('period').textContent = cfg.period + ',每晚 ' + cfg.hours;
    $('cutoffTop').textContent = '當日請假截止時間 ' + cfg.cutoff;

    var f = $('fields'); f.innerHTML = '';
    cfg.verify.forEach(function (v, i) {
      var l = document.createElement('label'); l.htmlFor = 'f' + i; l.textContent = v.label;
      var inp = document.createElement('input');
      inp.id = 'f' + i; inp.type = 'text'; inp.placeholder = v.hint;
      inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
      if (v.mode) inp.inputMode = v.mode;
      f.appendChild(l); f.appendChild(inp);
    });

    var rs = $('reason'); rs.innerHTML = '';
    rs.add(new Option('請選擇事由', ''));
    cfg.reasons.forEach(function (r) { rs.add(new Option(r, r)); });

    $('note').maxLength = cfg.noteMax;
    $('breaks').textContent = '下課時間:' + cfg.breaks.join('、');
    $('dateHint').textContent = '連續請假:「從」選第一天、「到」選最後一天,再按加入日期。不連續的日子可以分次加入,一次最多 ' + cfg.maxDates + ' 天。';
    $('cutoffNote').textContent = '當天 ' + cfg.cutoff + ' 之後無法線上請假或撤銷,請直接聯絡導師。';
    buildStrip();
  }

  /* 時間軸 */
  function buildStrip() {
    var el = $('strip'); el.innerHTML = '';
    cfg.sessions.forEach(function (s, i) {
      if (i > 0) {
        var g = document.createElement('span'); g.className = 'gap'; g.setAttribute('aria-hidden', 'true');
        el.appendChild(g);
      }
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'slot'; b.dataset.id = s.id;
      b.innerHTML = '<span class="s-name"></span><span class="s-time"></span><span class="s-state"></span>';
      b.children[0].textContent = s.label;
      b.children[1].textContent = s.time;
      b.addEventListener('click', function () { sel[s.id] = !sel[s.id]; refreshStrip(); });
      el.appendChild(b);
    });
    refreshStrip();
  }
  function refreshStrip() {
    Array.prototype.forEach.call($('strip').querySelectorAll('.slot'), function (b) {
      var on = !!sel[b.dataset.id];
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.children[2].textContent = on ? '請假' : '到校';
    });
    updateSummary();
  }
  function chosen() { return cfg.sessions.filter(function (s) { return sel[s.id]; }); }
  function sessionText() {
    var c = chosen();
    if (!c.length) return '';
    if (c.length === cfg.sessions.length) return '整晚';
    return c.map(function (s) { return s.label; }).join('、');
  }
  function datesText() {
    var L = picked.map(function (d) { return d.label; });
    if (!L.length) return '';
    return L.length <= 3 ? L.join('、') : L[0] + '~' + L[L.length - 1] + ' 等 ' + L.length + ' 天';
  }
  function updateSummary() {
    var d = datesText(), s = sessionText();
    $('summary').textContent = (d && s) ? d + ' ' + s + '請假' : '選好日期與節次後,這裡會顯示請假內容。';
  }
  $('allNight').addEventListener('click', function () { cfg.sessions.forEach(function (s) { sel[s.id] = true; }); refreshStrip(); });
  $('clearSel').addEventListener('click', function () { sel = {}; refreshStrip(); });

  /* 日期:從/到 → 加入 → 標籤 */
  function fillSelect(el, placeholder, dates) {
    el.innerHTML = '';
    el.add(new Option(placeholder, ''));
    var g = null, m = '';
    dates.forEach(function (d) {
      if (d.month !== m) { m = d.month; g = document.createElement('optgroup'); g.label = m; el.appendChild(g); }
      g.appendChild(new Option(d.label, d.date));
    });
  }
  function renderDates(dates) {
    openDates = dates;
    fillSelect($('dateFrom'), '請選擇日期', dates);
    fillSelect($('dateTo'), '只請這一天', dates);
    var open = dates.map(function (d) { return d.date; });
    picked = picked.filter(function (d) { return open.indexOf(d.date) >= 0; });
    $('noDates').hidden = dates.length > 0;
    renderChips();
    updateSummary();
  }
  function renderChips() {
    var box = $('chips'); box.innerHTML = '';
    if (!picked.length) {
      var p = document.createElement('p');
      p.className = 'muted small'; p.style.margin = '0';
      p.textContent = '還沒有加入日期。選好日期後,按「加入日期」。';
      box.appendChild(p); return;
    }
    picked.forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'dchip';
      b.setAttribute('aria-label', '移除 ' + d.label);
      b.textContent = d.label + '  ×';
      b.addEventListener('click', function () {
        picked = picked.filter(function (x) { return x.date !== d.date; });
        renderChips(); updateSummary();
      });
      box.appendChild(b);
    });
  }
  function addDates() {
    var from = $('dateFrom').value, to = $('dateTo').value;
    if (!from) { showBanner('error', '請先在「從」選一個日期。'); return false; }
    var list;
    if (!to) {
      list = openDates.filter(function (d) { return d.date === from; });
    } else {
      if (to < from) { showBanner('error', '「到」的日期要在「從」之後。'); return false; }
      list = openDates.filter(function (d) { return d.date >= from && d.date <= to; });
    }
    var have = picked.map(function (d) { return d.date; });
    var add = list.filter(function (d) { return have.indexOf(d.date) < 0; });
    if (picked.length + add.length > cfg.maxDates) {
      showBanner('error', '一次最多可以請 ' + cfg.maxDates + ' 天,請分次送出。'); return false;
    }
    picked = picked.concat(add).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    $('dateFrom').value = ''; $('dateTo').value = '';
    renderChips(); updateSummary();
    return true;
  }
  $('addDates').addEventListener('click', function () { clearBanner(); addDates(); });

  /* 紀錄 */
  function renderRecords(list) {
    var box = $('records'); box.innerHTML = '';
    if (!list.length) {
      var p = document.createElement('p'); p.className = 'muted'; p.style.margin = '0';
      p.textContent = '還沒有請假紀錄。'; box.appendChild(p); return;
    }
    list.forEach(function (r) {
      var off = r.status !== '有效';
      var row = document.createElement('div'); row.className = 'rec' + (off ? ' off' : '');
      var left = document.createElement('div');
      var d = document.createElement('div'); d.className = 'd';
      d.textContent = r.label + ' ' + r.sessions;
      var chip = document.createElement('span'); chip.className = 'chip' + (off ? ' off' : '');
      chip.textContent = r.status; d.appendChild(chip);
      var m = document.createElement('div'); m.className = 'm'; m.textContent = r.reason;
      left.appendChild(d); left.appendChild(m); row.appendChild(left);

      if (r.canCancel) {
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'cancel'; btn.textContent = '撤銷';
        btn.addEventListener('click', function () {
          if (!btn.dataset.armed) {
            btn.dataset.armed = '1'; btn.textContent = '確定撤銷?'; btn.classList.add('armed');
            setTimeout(function () {
              if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = '撤銷'; btn.classList.remove('armed'); }
            }, 4000);
            return;
          }
          clearBanner();
          run('apiCancel', [creds, r.id], function (res) {
            if (!res.ok) { showBanner('error', res.msg); return; }
            showBanner('ok', '已撤銷 ' + r.label + ' ' + r.sessions + ' 的請假。');
            applyData(res);
          });
        });
        row.appendChild(btn);
      }
      box.appendChild(row);
    });
  }
  function applyData(res) {
    if (res.dates) renderDates(res.dates);
    if (res.records) renderRecords(res.records);
  }

  /* 登入 */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault(); clearBanner();
    var vals = cfg.verify.map(function (v, i) { return $('f' + i).value.trim(); });
    if (vals.some(function (v) { return !v; })) { showBanner('error', '請填寫所有驗證資料。'); return; }
    run('apiLogin', [vals], function (res) {
      if (!res.ok) { showBanner('error', res.msg); return; }
      creds = vals;
      cfg.verify.forEach(function (v, i) { $('f' + i).value = ''; });
      $('who').textContent = (res.cls ? res.cls + ' ' : '') + res.seat + '號 ' + res.name;
      sel = {}; picked = []; refreshStrip();
      $('reason').value = ''; $('note').value = '';
      applyData(res);
      show('main');
    });
  });

  /* 送出 */
  $('submitBtn').addEventListener('click', function () {
    clearBanner();
    // 選了日期但忘記按「加入日期」時,自動幫他加入
    if ($('dateFrom').value && !addDates()) return;
    var st = chosen();
    if (!picked.length) { showBanner('error', '請先選擇請假日期。'); return; }
    if (!st.length) { showBanner('error', '請至少選擇一個請假節次。'); return; }
    if (!$('reason').value) { showBanner('error', '請選擇事由。'); return; }
    run('apiSubmit', [creds, {
      dates: picked.map(function (d) { return d.date; }),
      sessions: st.map(function (s) { return s.id; }),
      reason: $('reason').value,
      note: $('note').value
    }], function (res) {
      if (!res.ok) { showBanner('error', res.msg); return; }
      showBanner('ok', '已送出:' + res.summary + '。');
      sel = {}; picked = []; refreshStrip(); $('reason').value = ''; $('note').value = '';
      applyData(res);
    });
  });

  /* 登出(共用手機時使用) */
  $('logout').addEventListener('click', function () {
    creds = null; sel = {}; picked = []; clearBanner(); show('login');
  });
})();
</script>
</body>
</html>
